<svg xmlns="http://www.w3.org/2000/svg" width="230" height="80" viewBox="0 0 230 80" role="img" aria-labelledby="title">
  <title id="title">Instagram: @sleep.marcoo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.55" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#feda75"/>
      <stop offset="0.25" stop-color="#fa7e1e"/>
      <stop offset="0.5" stop-color="#d62976"/>
      <stop offset="0.75" stop-color="#962fbf"/>
      <stop offset="1" stop-color="#4f5bd5"/>
    </linearGradient>
    <radialGradient id="badge" cx="30%" cy="107%" r="150%">
      <stop offset="0" stop-color="#fdf497"/>
      <stop offset="0.05" stop-color="#fdf497"/>
      <stop offset="0.45" stop-color="#fd5949"/>
      <stop offset="0.6" stop-color="#d6249f"/>
      <stop offset="0.9" stop-color="#285aeb"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="clip">
      <rect x="10" y="10" width="210" height="60" rx="16"/>
    </clipPath>
  </defs>
  <style>
    .shine { transform: translateX(0) skewX(-20deg); animation: shine 6s ease-in-out 1.6s infinite; }
    @keyframes shine {
      0% { transform: translateX(0) skewX(-20deg); }
      22%, 100% { transform: translateX(310px) skewX(-20deg); }
    }
    @media (prefers-reduced-motion: reduce) { .shine { animation: none; } }
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  </style>

  <!-- soft brand glow -->
  <rect x="12" y="13" width="206" height="58" rx="16" fill="url(#border)" opacity="0.45" filter="url(#glow)"/>

  <!-- pill -->
  <rect x="10" y="10" width="210" height="60" rx="16" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <rect class="shine" x="-60" y="0" width="50" height="80" fill="url(#shine)"/>
  </g>
  <rect x="10.75" y="10.75" width="208.5" height="58.5" rx="15.25" fill="none" stroke="url(#border)" stroke-width="1.5"/>

  <!-- icon -->
  <g transform="translate(22 22)">
    <rect width="36" height="36" rx="10" fill="url(#badge)"/>
    <rect x="10" y="10" width="16" height="16" rx="4.8" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="18" cy="18" r="3.9" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="22.5" cy="13.5" r="1.2" fill="#ffffff"/>
  </g>

  <!-- label -->
  <text x="70" y="35.5" font-size="15.5" font-weight="700" fill="#f1f5f9">Instagram</text>
  <text x="70" y="52.5" font-size="11.5" fill="#94a3b8">@sleep.marcoo</text>

  <!-- arrow -->
  <circle cx="196" cy="40" r="11" fill="#38bdf8" fill-opacity="0.12"/>
  <path d="M192.5 43.5 L199.5 36.5 M193.5 36.5 H199.5 V42.5" fill="none" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
